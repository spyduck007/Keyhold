[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-vault"
version = "0.1.0"
description = "A password-and-USB protected encrypted vault."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12.0",
]

[project.scripts]
usb-vault = "usb_vault.cli.main:main"
usb-vault-gui = "usb_vault.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["usb_vault"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true